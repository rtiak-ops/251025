# バックエンドのCI（継続的インテグレーション）ワークフロー
name: Backend CI Pipeline

# 実行トリガーの設定
on:
  # main または develop ブランチへのプッシュ時に実行
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  # main または develop ブランチへのプルリクエスト作成・更新時に実行
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  # テストジョブ：ユニットテストとカバレッジ測定
  test:
    name: Backend Test
    runs-on: ubuntu-latest
    
    # データベースを使用するテストのためにPostgreSQLサービスを起動
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        # データベースが起動するまで待機する設定
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      # リポジトリをチェックアウト
      - name: チェックアウト
        uses: actions/checkout@v4

      # Pythonの実行環境をセットアップ
      - name: Python環境のセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip' # pipのキャッシュを利用して高速化

      # 必要なライブラリのインストール
      - name: 依存関係のインストール
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # pytestを使用してテストを実行し、カバレッジを測定
      - name: テストの実行 (pytest)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          SECRET_KEY: test_secret_key_for_ci_only_min_32_chars_long
          ENV: development
        run: |
          pytest -v --cov=app --cov-report=xml --cov-report=term

      # カバレッジレポートをCodecovにアップロード（push時のみ）
      - name: カバレッジレポートのアップロード
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ビルドチェックジョブ：Dockerイメージのビルドが可能か確認
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test # テストが成功した場合のみ実行
    if: github.event_name == 'push'
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      # 高速なビルドのためのビルドツールをセットアップ
      - name: Docker Buildxのセットアップ
        uses: docker/setup-buildx-action@v3

      # 実際にビルドを行い、エラーがないか確認（Pushはしない）
      - name: バックエンドイメージのビルド (テストのみ)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: todo-backend:latest
          cache-from: type=gha # GitHub Actionsのキャッシュを利用
          cache-to: type=gha,mode=max

  # セキュリティスキャンジョブ：脆弱性診断
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test # テストが成功した場合のみ実行
    # セキュリティ結果をGitHubに書き込む権限
    permissions:
      security-events: write
      contents: read
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      # Trivyを使用してソースコード内の脆弱性をスキャン
      - name: Trivyによる脆弱性スキャン
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'

      # スキャン結果をGitHubのSecurityタブに表示させる
      - name: スキャン結果をGitHub Securityタブにアップロード
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: 'backend'
