# フロントエンドのCI（継続的インテグレーション）ワークフロー
name: Frontend CI Pipeline

# 実行トリガーの設定
on:
  # main または develop ブランチへのプッシュ時に実行
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  # main または develop ブランチへのプルリクエスト作成・更新時に実行
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  # テスト・リントジョブ：コードの品質チェック
  test:
    name: Frontend Test & Lint
    runs-on: ubuntu-latest
    steps:
      # リポジトリをチェックアウト
      - name: チェックアウト
        uses: actions/checkout@v4

      # Node.jsの実行環境をセットアップ
      - name: Node.js環境のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm' # npmのキャッシュを利用して高速化
          cache-dependency-path: ./frontend/package-lock.json

      # 依存関係のインストール（高速なciコマンドを使用）
      - name: 依存関係のインストール
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      # ESLintによるコード規約チェック
      - name: リントの実行 (コード規約チェック)
        working-directory: ./frontend
        run: npm run lint

      # ユニットテストの実行とカバレッジの測定
      - name: テストの実行 (Vitest/Jest等)
        working-directory: ./frontend
        run: npm run test:coverage

      # 本番用ファイルのビルドが可能か確認
      - name: ビルドの実行 (本番用ファイルの生成)
        working-directory: ./frontend
        run: npm run build

      # カバレッジレポートをCodecovにアップロード（push時のみ）
      - name: カバレッジレポートのアップロード
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          file: ./frontend/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false

  # ビルドチェックジョブ：Dockerイメージのビルドが可能か確認
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test # テストが成功した場合のみ実行
    if: github.event_name == 'push'
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      # 高速なビルドのためのビルドツールをセットアップ
      - name: Docker Buildxのセットアップ
        uses: docker/setup-buildx-action@v3

      # 実際にビルドを行い、エラーがないか確認（Pushはしない）
      - name: フロントエンドイメージのビルド (テストのみ)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: todo-frontend:latest
          cache-from: type=gha # GitHub Actionsのキャッシュを利用
          cache-to: type=gha,mode=max

  # セキュリティスキャンジョブ：脆弱性診断
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test # テストが成功した場合のみ実行
    # セキュリティ結果をGitHubに書き込む権限
    permissions:
      security-events: write
      contents: read
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      # Trivyを使用してソースコード・ライブラリの脆弱性をスキャン
      - name: Trivyによる脆弱性スキャン
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './frontend'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'

      # スキャン結果をGitHubのSecurityタブに表示させる
      - name: フロントエンドのスキャン結果をアップロード
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'
          category: 'frontend'
