name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # バックエンドのテストとリント
  backend-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 依存関係のインストール
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: テストの実行
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          SECRET_KEY: test_secret_key_for_ci_only_min_32_chars_long
          ENV: development
        run: |
          pytest -v --cov=app --cov-report=xml --cov-report=term

      - name: カバレッジレポートのアップロード
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # フロントエンドのテストとビルド
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js環境のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: 依存関係のインストール
        working-directory: ./frontend
        run: npm ci

      - name: リントの実行
        working-directory: ./frontend
        run: npm run lint

      - name: テストの実行
        working-directory: ./frontend
        run: npm run test:coverage

      - name: ビルドの実行
        working-directory: ./frontend
        run: npm run build

      - name: カバレッジレポートのアップロード
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          file: ./frontend/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false

  # Dockerイメージのビルドテスト
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push'

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Docker Buildxのセットアップ
        uses: docker/setup-buildx-action@v3

      - name: バックエンドイメージのビルド
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: todo-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: フロントエンドイメージのビルド
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: todo-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # セキュリティスキャン
  security-scan:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    permissions:
      security-events: write # SARIFのアップロードに必須
      contents: read         # チェックアウトに必要

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Trivyによる脆弱性スキャン（バックエンド）
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'

      - name: Trivyによる脆弱性スキャン（フロントエンド）
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './frontend'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'

      - name: バックエンドのスキャン結果をアップロード
        uses: github/codeql-action/upload-sarif@v3 # v3の非推奨警告はあるが、一旦設定を修正
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: 'backend' # カテゴリを分けることで重複エラーを回避

      - name: フロントエンドのスキャン結果をアップロード
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'
          category: 'frontend'
