name: CI

# 【トリガー設定】
# いつこの自動処理を動かすかを決めます
on:
  push:
    # メインのコードが更新された時に、壊れていないか自動チェックします
    branches: [ "main", "master" ]
  pull_request:
    # 本番に取り込む前に、テストが通ることを確認するために動かします
    branches: [ "main", "master" ]

# 【ジョブ定義】
# GitHubが用意してくれる「まっさらなPC（仮想マシン）」上で行う作業手順です
jobs:
  test-backend:
    # 常に最新かつ安定したUbuntu環境を利用します
    runs-on: ubuntu-latest

    # 「backend」フォルダの中にソースコードがある構成に対応しています
    defaults:
      run:
        working-directory: ./backend

    steps:
    # 1. コードの取得
    # 実行環境にあなたのプログラムをコピーします
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Pythonの準備
    # 開発環境と同じバージョン（3.13）を用意して、動作の不一致を防ぎます
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    # 3. ライブラリの導入
    # 実行に必要なツールをすべてインストールします
    - name: Install dependencies
      run: |
        # pip自体を最新にすることで、インストールエラーのリスクを減らします
        python -m pip install --upgrade pip
        pip uninstall -y pytest-pythonpath
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. テストの実行
    - name: Run tests with pytest
      env:
        DATABASE_URL: "postgresql+asyncpg://dummy:dummy@localhost/dummy"
        TESTING: "true"
      run: |
        # すでに defaults で backend フォルダにいるため、パスの指定を調整します。
        # 1. PYTHONPATH にカレントディレクトリ（backend）を追加
        export PYTHONPATH=$PYTHONPATH:.
        
        # 2. キャッシュ無効化、設定ファイル明示、テストファイル指定
        # backend フォルダ内に pytest.ini があるため、そのまま pytest を実行すれば読み込まれます。
        pytest -p no:cacheprovider -c pytest.ini tests/test_auth.py