# ワークフローの名前を定義します。GitHubのActionsタブにこの名前が表示されます。
name: CI/CD Pipeline

# ワークフローが実行される条件（トリガー）を設定します。
on:
  # コードがGitHubにプッシュされた時に実行します。
  push:
    # 対象となるブランチを指定します。
    branches: [main, develop]
  # プルリクエストが作成されたり更新されたりした時に実行します。
  pull_request:
    # 対象となるブランチを指定します。
    branches: [main, develop]

# 実行される一連の処理（ジョブ）のブロックを開始します。
jobs:
  # バックエンドのテストを行うジョブを定義します。
  backend-test:
    # 実行環境として Ubuntu（Linux）の最新版を使用します。
    runs-on: ubuntu-latest
    
    # ジョブ内で使用する追加サービスを定義します。ここではデータベースです。
    services:
      # PostgreSQLデータベースを「postgres」という名前で起動します。
      postgres:
        # 使用するDockerイメージとバージョン（PostgreSQL 17）を指定します。
        image: postgres:17
        # データベース起動時に必要な環境変数を設定します。
        env:
          # データベース接続用のユーザー名です。
          POSTGRES_USER: test_user
          # データベース接続用のパスワードです。
          POSTGRES_PASSWORD: test_password
          # 作成するデータベースの名前です。
          POSTGRES_DB: test_db
        # データベースが正しく起動したか確認するためのヘルスチェック設定です。
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        # 実行環境のポートとコンテナのポートを接続します。
        ports:
          - 5432:5432

    # 実行する具体的な手順（ステップ）を定義します。
    steps:
      # GitHubからリポジトリのコードをこの実行環境にコピーします。
      - name: チェックアウト
        uses: actions/checkout@v4

      # Pythonの実行環境をセットアップします。
      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          # Pythonのバージョンを3.13に指定します。
          python-version: '3.13'
          # pipでインストールしたライブラリをキャッシュして次回以降を高速化します。
          cache: 'pip'

      # プログラムの動作に必要なライブラリをインストールします。
      - name: 依存関係のインストール
        # backendディレクトリ内でコマンドを実行するように指定します。
        working-directory: ./backend
        run: |
          # pip本体を最新バージョンに更新します。
          python -m pip install --upgrade pip
          # requirements.txtに記載されたライブラリをインストールします。
          pip install -r requirements.txt

      # 自動テスト(pytest)を実行します。
      - name: テストの実行 (pytest)
        # backendディレクトリ内でコマンドを実行します。
        working-directory: ./backend
        # テスト実行に必要な環境変数を設定します。
        env:
          # テスト用のデータベース接続文字列です。
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          # アプリケーションの認証などで使う秘密鍵です（テスト用）。
          SECRET_KEY: test_secret_key_for_ci_only_min_32_chars_long
          # 実行環境を開発モードに設定します。
          ENV: development
        run: |
          # pytestを実行し、テストのカバレッジ（網羅率）を計測してレポートを出力します。
          pytest -v --cov=app --cov-report=xml --cov-report=term

      # テストの網羅率（カバレッジ）をCodecovサービスにアップロードします。
      - name: カバレッジレポートのアップロード
        uses: codecov/codecov-action@v4
        # pushされた時（プルリクエスト時以外）のみ実行するようにします。
        if: github.event_name == 'push'
        with:
          # アップロードするレポートファイルのパスを指定します。
          file: ./backend/coverage.xml
          # レポートに付けるタグのような名前です。
          flags: backend
          # アップロードに失敗してもCI全体をエラーにしない設定です。
          fail_ci_if_error: false

  # フロントエンドのテストとビルドを確認するジョブを定義します。
  frontend-test:
    # 実行環境として Ubuntu の最新版を使用します。
    runs-on: ubuntu-latest

    steps:
      # コードをチェックアウトします。
      - name: チェックアウト
        uses: actions/checkout@v4

      # Node.js（JavaScript実行環境）をセットアップします。
      - name: Node.js環境のセットアップ
        uses: actions/setup-node@v4
        with:
          # Node.jsのバージョンを23に指定します。
          node-version: '23'
          # npmライブラリをキャッシュして高速化します。
          cache: 'npm'
          # キャッシュの判定に使うファイルを指定します。
          cache-dependency-path: ./frontend/package-lock.json

      # フロントエンドに必要なライブラリをインストールします。
      - name: 依存関係のインストール
        # frontendディレクトリ内で実行します。
        working-directory: ./frontend
        # 厳密にバージョンを固定してインストールする npm ci コマンドを使います。
        run: npm ci

      # コードの書き方に問題（バグの種など）がないか機械的にチェックします。
      - name: リントの実行 (コード規約チェック)
        working-directory: ./frontend
        run: npm run lint

      # フロントエンドの自動テストを実行し、カバレッジを計測します。
      - name: テストの実行 (Vitest/Jest等)
        working-directory: ./frontend
        run: npm run test:coverage

      # 本番環境用のファイルを生成できるか、ビルド処理を試します。
      - name: ビルドの実行 (本番用ファイルの生成)
        working-directory: ./frontend
        run: npm run build

      # フロントエンドのテスト結果をCodecovにアップロードします。
      - name: カバレッジレポートのアップロード
        uses: codecov/codecov-action@v4
        # push時のみ実行します。
        if: github.event_name == 'push'
        with:
          # 生成されたカバレッジファイルのパスを指定します。
          file: ./frontend/coverage/coverage-final.json
          # レポートに付けるタグです。
          flags: frontend
          fail_ci_if_error: false

  # Dockerイメージがビルド可能か確認するジョブを定義します。
  docker-build:
    runs-on: ubuntu-latest
    # バックエンドとフロントエンドのテストが成功した後に実行します。
    needs: [backend-test, frontend-test]
    # pushされた時のみ実行します。
    if: github.event_name == 'push'

    steps:
      # コードをチェックアウトします。
      - name: チェックアウト
        uses: actions/checkout@v4

      # Dockerの高度なビルド機能を使えるようにセットアップします。
      - name: Docker Buildxのセットアップ
        uses: docker/setup-buildx-action@v3

      # バックエンドのDockerイメージをビルドできるかチェックします。
      - name: バックエンドイメージのビルド (テストのみ)
        uses: docker/build-push-action@v5
        with:
          # ビルドの起点となるディレクトリです。
          context: ./backend
          # テストなので、ビルドしたイメージをどこかへ保存（push）はしません。
          push: false
          # ビルドするイメージに付ける一時的な名前です。
          tags: todo-backend:latest
          # GitHub Actionsのキャッシュ機能を使ってビルドを高速化します。
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # フロントエンドのDockerイメージをビルドできるかチェックします。
      - name: フロントエンドイメージのビルド (テストのみ)
        uses: docker/build-push-action@v5
        with:
          # ビルドの起点となるディレクトリです。
          context: ./frontend
          push: false
          tags: todo-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # セキュリティ上の問題がないかスキャンするジョブです。
  security-scan:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    # ブラウザ上のGitHub Securityタブに結果を表示するための権限です。
    permissions:
      # セキュリティイベントを書き込む権限です。
      security-events: write
      # リポジトリの中身を読み取る権限です。
      contents: read

    steps:
      # コードをチェックアウトします。
      - name: チェックアウト
        uses: actions/checkout@v4

      # Trivyを使ってバックエンドのソースコードをスキャンします。
      - name: Trivyによる脆弱性スキャン（バックエンド）
        uses: aquasecurity/trivy-action@master
        with:
          # フォルダ（ファイルシステム）をスキャンする指定です。
          scan-type: 'fs'
          # 対象のパスを指定します。
          scan-ref: './backend'
          # 結果の保存形式をGitHub推奨のSARIFにします。
          format: 'sarif'
          # 保存するファイル名です。
          output: 'trivy-backend-results.sarif'

      # Trivyを使ってフロントエンドのソースコードをスキャンします。
      - name: Trivyによる脆弱性スキャン（フロントエンド）
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './frontend'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'

      # バックエンドのスキャン結果をGitHubにアップロードします。
      - name: スキャン結果をGitHub Securityタブにアップロード
        uses: github/codeql-action/upload-sarif@v3
        # 前のステップが失敗しても（脆弱性が見つかっても）、必ずこの処理を実行します。
        if: always()
        with:
          # アップロードするファイルの指定です。
          sarif_file: 'trivy-backend-results.sarif'
          # 後で識別しやすくするためのカテゴリ名です。
          category: 'backend'

      # フロントエンドのスキャン結果をGitHubにアップロードします。
      - name: フロントエンドのスキャン結果をアップロード
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'
          category: 'frontend'
