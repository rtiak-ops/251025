# ワークフローの名前。GitHubのActionsタブに表示されます。
name: CI/CD Pipeline

# 実行タイミング（トリガー）の設定
on:
  push:
    branches: [main, develop] # mainとdevelopへのpush時に実行
  pull_request:
    branches: [main, develop] # PR作成時にも実行して、マージ前に安全性を確認

jobs:
  # ==========================================
  # 1. バックエンドのテストとリント
  # ==========================================
  backend-test:
    runs-on: ubuntu-latest
    
    # テストに必要なデータベース(PostgreSQL)を立ち上げる
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        # DBが起動してリクエストを受け付けられるか確認（ヘルスチェック）
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip' # 依存関係をキャッシュして2回目以降を高速化

      - name: 依存関係のインストール
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: テストの実行 (pytest)
        working-directory: ./backend
        env:
          # テスト用の接続URL。asyncpgを使用
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          SECRET_KEY: test_secret_key_for_ci_only_min_32_chars_long
          ENV: development
        run: |
          # テスト実行とカバレッジ（コード網羅率）の計測
          pytest -v --cov=app --cov-report=xml --cov-report=term

      - name: カバレッジレポートのアップロード
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push' # push時のみレポートを送信
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ==========================================
  # 2. フロントエンドのテストとビルド
  # ==========================================
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js環境のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: 依存関係のインストール
        working-directory: ./frontend
        run: npm ci

      - name: リントの実行 (コード規約チェック)
        working-directory: ./frontend
        run: npm run lint

      - name: テストの実行 (Vitest/Jest等)
        working-directory: ./frontend
        run: npm run test:coverage

      - name: ビルドの実行 (本番用ファイルの生成)
        working-directory: ./frontend
        run: npm run build

      - name: カバレッジレポートのアップロード
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          file: ./frontend/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false

  # ==========================================
  # 3. Dockerイメージのビルドテスト
  # ==========================================
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test] # テスト合格後に実行
    if: github.event_name == 'push'      # push時のみ実行

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Docker Buildxのセットアップ (高度なビルド機能)
        uses: docker/setup-buildx-action@v3

      - name: バックエンドイメージのビルド (保存はせずテストのみ)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: todo-backend:latest
          cache-from: type=gha # GitHub Actionsのキャッシュを利用
          cache-to: type=gha,mode=max

      - name: フロントエンドイメージのビルド
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: todo-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 4. セキュリティスキャン (脆弱性チェック)
  # ==========================================
  security-scan:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    permissions:
      security-events: write # GitHub Securityタブへの表示に必要
      contents: read

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Trivyによる脆弱性スキャン（バックエンド）
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs' # ファイルシステムをスキャン
          scan-ref: './backend'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'

      - name: Trivyによる脆弱性スキャン（フロントエンド）
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './frontend'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'

      - name: スキャン結果をGitHub Securityタブにアップロード
        uses: github/codeql-action/upload-sarif@v3
        if: always() # 前のステップが失敗しても(脆弱性が見つかっても)必ず実行
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: 'backend'

      - name: フロントエンドのスキャン結果をアップロード
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'
          category: 'frontend'

  # ==========================================
  # 5. デプロイ (本番環境への反映)
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan] # テストとリントが成功した後に実行
    # main または develop ブランチへのプッシュ時のみ実行
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    # OIDC認証のために必要な権限
    permissions:
      id-token: write
      contents: read

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      # --- AWS 認証 (OIDC) ---
      - name: AWS 認証設定
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # IAMロールのARNを指定（GitHub Secretsに登録）
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      # --- フロントエンドのデプロイ (S3 & CloudFront) ---
      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: フロントエンドのビルド
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: S3へ同期
        run: |
          aws s3 sync ./frontend/dist s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: CloudFrontキャッシュクリア (Invalidation)
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      # --- バックエンドのデプロイ (EC2) ---
      - name: EC2へデプロイ
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/251025
            git pull origin ${{ github.ref_name }}
            # Docker イメージのビルドと起動
            docker compose up -d --build
            # DBマイグレーションの実行 (Alembic)
            docker compose exec -T backend alembic upgrade head
