name: CI

# 【トリガー設定】
# いつこの自動処理を動かすかを決めます
on:
  push:
    # メインのコードが更新された時に、壊れていないか自動チェックします
    branches: [ "main", "master" ]
  pull_request:
    # 本番に取り込む前に、テストが通ることを確認するために動かします
    branches: [ "main", "master" ]

# 【ジョブ定義】
# GitHubが用意してくれる「まっさらなPC（仮想マシン）」上で行う作業手順です
jobs:
  test-backend:
    # 常に最新かつ安定したUbuntu環境を利用します
    runs-on: ubuntu-latest

    # 「backend」フォルダの中にソースコードがある構成に対応しています
    defaults:
      run:
        working-directory: ./backend

    steps:
    # 1. コードの取得
    # 実行環境にあなたのプログラムをコピーします
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Pythonの準備
    # 開発環境と同じバージョン（3.13）を用意して、動作の不一致を防ぎます
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    # 3. ライブラリの導入
    # 実行に必要なツールをすべてインストールします
    - name: Install dependencies
      run: |
        # pip自体を最新にすることで、インストールエラーのリスクを減らします
        python -m pip install --upgrade pip
        pip uninstall -y pytest-pythonpath
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. テストの実行
    # 最後に「プログラムが正しく動くか」を自動チェックします
    - name: Run tests with pytest
      env:
        # 【重要】アプリがデータベース接続を求める場合、ここで「仮の住所」を教えます。
        # 実際のデータベースには繋ぎませんが、エラーで止まるのを防ぐための「おまじない」です。
        DATABASE_URL: "postgresql+asyncpg://dummy:dummy@localhost/dummy"
        # ↓ これを追加：テスト環境であることをアプリに伝える
        TESTING: "true"
      run: |
        # カレントディレクトリをパスに通し、pytestがモジュールを見つけられるようにします
        export PYTHONPATH=$PYTHONPATH:.
        # testsフォルダ内のテストをすべて実行します
        # 「-W ignore」を追加して、特定の警告を強制的に非表示にします
        pytest -W "ignore:Unknown config option:pytest.PytestConfigWarning" tests/