name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
    # 1. コードの取得
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Python 3.13 のセットアップ
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    # 3. 依存ライブラリのインストール
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # backendフォルダ内の requirements.txt を使用
        if [ -f backend/requirements.txt ]; then
          pip install -r backend/requirements.txt
        fi

    # 4. テストの実行
    - name: Run tests with pytest
      env:
        DATABASE_URL: "postgresql+asyncpg://dummy:dummy@localhost/dummy"
        TESTING: "true"
        # 設定ファイルが無視された時のための保険
        PYTEST_ASYNCIO_MODE: "auto"
      run: |
        # 確実に backend ディレクトリに移動
        cd ${{ github.workspace }}/backend
        
        # カレントディレクトリをパスに通す
        export PYTHONPATH=.
        
        # 【修正の肝】
        # -c /dev/null を削除し、-c pytest.ini で設定を強制読み込み。
        # --rootdir=. で /dev に行くバグを物理的に防ぎます。
        python -m pytest -v \
          --rootdir=. \
          -c pytest.ini \
          -p no:cacheprovider \
          tests/test_auth.py