name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    # 【重要】すべての処理を backend フォルダ基準で行います
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run tests with pytest
      env:
        DATABASE_URL: "postgresql+asyncpg://dummy:dummy@localhost/dummy"
        TESTING: "true"
        # 設定ファイルが読み込まれない場合の「保険」として環境変数でも AUTO を指定
        PYTEST_ASYNCIO_MODE: "auto"
      run: |
        # 1. カレントディレクトリをパスに通す
        export PYTHONPATH=$PYTHONPATH:.
        
        # 2. 【最重要】「-c /dev/null」を削除しました。
        # 代わりに「-c pytest.ini」で設定を強制読み込みし、
        # 「--rootdir=.」で rootdir: /dev になるバグを物理的に防ぎます。
        python -m pytest -v \
          --rootdir=. \
          -c pytest.ini \
          -p no:cacheprovider \
          tests/test_auth.py