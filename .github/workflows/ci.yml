name: CI

# 【トリガー設定】
# いつこの自動処理を動かすかを決めます
on:
  push:
    # メインのコードが更新された時に、壊れていないか自動チェックします
    branches: [ "main", "master" ]
  pull_request:
    # 本番に取り込む前に、テストが通ることを確認するために動かします
    branches: [ "main", "master" ]

# 【ジョブ定義】
# GitHubが用意してくれる「まっさらなPC（仮想マシン）」上で行う作業手順です
jobs:
  test-backend:
    # 常に最新かつ安定したUbuntu環境を利用します
    runs-on: ubuntu-latest

    # 「backend」フォルダの中にソースコードがある構成に対応しています
    defaults:
      run:
        working-directory: ./backend

    steps:
    # 1. コードの取得
    # 実行環境にあなたのプログラムをコピーします
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Pythonの準備
    # 開発環境と同じバージョン（3.13）を用意して、動作の不一致を防ぎます
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    # 3. ライブラリの導入
    # 実行に必要なツールをすべてインストールします
    - name: Install dependencies
      run: |
        # pip自体を最新にすることで、インストールエラーのリスクを減らします
        python -m pip install --upgrade pip
        pip uninstall -y pytest-pythonpath
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. テストの実行
    - name: Run tests with pytest
      env:
        DATABASE_URL: "postgresql+asyncpg://dummy:dummy@localhost/dummy"
        TESTING: "true"
      run: |
        # 1. 確実に backend ディレクトリに移動してから実行
        cd ${GITHUB_WORKSPACE}/backend
        
        # 2. PYTHONPATH を絶対パスで上書き
        export PYTHONPATH=${GITHUB_WORKSPACE}/backend
        
        # 3. 設定をコマンドライン引数で「直接」注入する
        # これにより pytest.ini の読み込み失敗を物理的に回避します
        pytest -p no:cacheprovider \
               -o "asyncio_mode=auto" \
               -o "asyncio_default_fixture_loop_scope=function" \
               tests/test_auth.py