name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # backend フォルダがあることを確認してからインストール
        if [ -d "backend" ]; then
          pip install -r backend/requirements.txt
        else
          # ルートに直置きされている場合
          pip install -r requirements.txt
        fi

    - name: Run tests with pytest
      env:
        DATABASE_URL: "postgresql+asyncpg://dummy:dummy@localhost/dummy"
        TESTING: "true"
        # 【最重要】設定ファイル(ini)を無視して、環境変数で強制的にモードを AUTO にします
        PYTEST_ASYNCIO_MODE: "auto"
      run: |
        # 1. PYTHONPATH を絶対パスで設定
        export PYTHONPATH=${{ github.workspace }}/backend
        
        # 2. --rootdir で rootdir: /dev になる問題を物理的に防ぐ
        # 3. -p no:cacheprovider で権限エラーを完全に封じ込める
        # 4. python -m pytest で、正しいPython環境のpytestを呼び出す
        python3 -m pytest -v \
          --rootdir=${{ github.workspace }}/backend \
          -p no:cacheprovider \
          ${{ github.workspace }}/backend/tests/test_auth.py