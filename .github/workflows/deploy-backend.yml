# バックエンド専用のデプロイワークフロー
name: CD Backend

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'terraform/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: AWS 認証設定
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: 最新のインフラ情報を取得
        id: infra-info
        run: bash scripts/get-infra-info.sh

      - name: EC2へデプロイ (SSM経由)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RDS_ENDPOINT: ${{ steps.infra-info.outputs.rds_endpoint }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          EC2_IP: ${{ steps.infra-info.outputs.ec2_ip }}
          CF_DOMAIN: ${{ steps.infra-info.outputs.cf_domain }}
        run: |
          # テンプレートに変数を埋め込んで実行用スクリプトを生成
          # 内部変数が消えないよう、置換対象を明示的に指定
          # また、変数の前後の余計な空白を念のため除去
          DB_PASSWORD=$(echo "${{ secrets.DB_PASSWORD }}" | xargs)
          APP_SECRET_KEY=$(echo "${{ secrets.APP_SECRET_KEY }}" | xargs)
          
          export DB_PASSWORD APP_SECRET_KEY
          
          envsubst '$GITHUB_REPOSITORY $GITHUB_REF_NAME $DB_PASSWORD $RDS_ENDPOINT $APP_SECRET_KEY $EC2_IP $CF_DOMAIN' < scripts/deploy-ec2.sh.template > deploy_script_raw.sh
          
          # 改行コードを完全に除去(CRLF -> LF)し、確実にクリーンなスクリプトを作成
          tr -d '\r' < deploy_script_raw.sh > deploy_script.sh
          
          echo "SSMコマンドを送信中 (InstanceId: ${{ steps.infra-info.outputs.instance_id }})..."
          
          # パラメータをJSONファイルとして作成（型エラーとエスケープ問題を確実に回避）
          jq -n --arg cmd "$(cat deploy_script.sh)" '{"commands": [$cmd]}' > ssm_params.json
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.infra-info.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --cli-input-json "{\"Parameters\": $(cat ssm_params.json)}" \
            --query "Command.CommandId" \
            --output text)
          
          echo "コマンド送信完了。ID: $COMMAND_ID. 実行完了を待機中（最大10分）..."
          
          # カスタム待機ループ（標準の waiter よりも柔軟で詳細なログを出力可能）
          for i in {1..60}; do
            INVOCATION=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ steps.infra-info.outputs.instance_id }}" --output json 2>/dev/null || echo "{}")
            STATUS=$(echo "$INVOCATION" | jq -r '.Status // "Pending"')
            
            echo "現在のステータス: $STATUS ($i/60)"
            
            if [[ "$STATUS" == "Success" ]]; then
              echo "デプロイが正常に完了しました。"
              exit 0
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "!!! エラー: デプロイが失敗しました (Status: $STATUS) !!!"
              echo "--- 標準出力 ---"
              echo "$INVOCATION" | jq -r '.StandardOutputContent'
              echo "--- 標準エラー出力 ---"
              echo "$INVOCATION" | jq -r '.StandardErrorContent'
              exit 1
            fi
            sleep 10
          done
          
          echo "エラー: デプロイがタイムアウトしました。"
          exit 1

          