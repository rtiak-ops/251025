# ワークフローの名前を定義します。
name: CD Pipeline (Deploy)

# ワークフローを実行する条件（トリガー）を設定します。
on:
  # GitHubの管理画面からボタンをクリックして手動で実行できるようにします。
  workflow_dispatch:
  # 指定したブランチにコードが保存(push)された時に実行します。
  push:
    # 対象となるブランチ（main と develop）を指定します。
    branches: [main, develop]

# 実行される一連の処理（ジョブ）を定義します。
jobs:
  # デプロイ（本番環境などへの反映）を行うジョブを定義します。
  deploy:
    # 実行環境として Ubuntu（Linux）の最新版を使用します。
    runs-on: ubuntu-latest
    
    # 安全に AWS と通信（認証）を行うための権限を設定します。
    permissions:
      # OIDC（OpenID Connect）を使って一時的な ID トークンを発行する権限です。
      id-token: write
      # リポジトリの内容を読み取る権限です。
      contents: read

    # 実行する具体的な手順（ステップ）を記述します。
    steps:
      # GitHubからリポジトリのコードをこの実行環境にコピーします。
      - name: チェックアウト
        uses: actions/checkout@v4

      # AWS認証情報（IAMロールなど）を設定し、AWSを使えるようにします。
      - name: AWS 認証設定
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 使用するIAMロールのARNをSecretsから取得します。
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          # AWSのリージョンを東京（ap-northeast-1）に設定します。
          aws-region: ap-northeast-1

      # 現在稼働しているAWSインフラの最新情報を動的に取得します。
      - name: 最新のインフラ情報を取得
        id: infra-info
        run: bash scripts/get-infra-info.sh

      # フロントエンドをビルドするためにNode.jsをセットアップします。
      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      # フロントエンドの本番用ファイルを生成します。
      - name: フロントエンドのビルド
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: https://${{ steps.infra-info.outputs.cf_domain }}
        run: |
          npm ci
          npm run build

      # ビルドされたファイルを S3 バケットにアップロード（同期）します。
      - name: S3へ同期
        run: |
          aws s3 sync ./frontend/dist s3://${{ steps.infra-info.outputs.s3_bucket }} --delete

      # 世界中のキャッシュサーバーに残っている古いデータを消去して即時反映させます。
      - name: CloudFrontキャッシュクリア
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ steps.infra-info.outputs.cf_id }} --paths "/*"

      # バックエンドを動かしているEC2サーバーへSSM経由で接続し、中身を更新します。
      - name: EC2へデプロイ (SSM経由)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RDS_ENDPOINT: ${{ steps.infra-info.outputs.rds_endpoint }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          EC2_IP: ${{ steps.infra-info.outputs.ec2_ip }}
          CF_DOMAIN: ${{ steps.infra-info.outputs.cf_domain }}
        run: |
          # テンプレートに変数を埋め込んで実行用スクリプトを生成
          envsubst < scripts/deploy-ec2.sh.template > deploy_script.sh
          sed -i 's/\r$//' deploy_script.sh
          
          echo "SSMコマンドを送信中 (InstanceId: ${{ steps.infra-info.outputs.instance_id }})..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.infra-info.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=$(cat deploy_script.sh | jq -R -s .)" \
            --query "Command.CommandId" \
            --output text)
          
          echo "コマンド送信完了。ID: $COMMAND_ID. 完了を待機中..."
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ steps.infra-info.outputs.instance_id }}"
          
          INVOCATION=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ steps.infra-info.outputs.instance_id }}" --output json)
          STATUS=$(echo "$INVOCATION" | jq -r '.Status')
          echo "最終ステータス: $STATUS"
          
          if [ "$STATUS" != "Success" ]; then
            echo "!!! エラー: デプロイが失敗しました !!!"
            echo "--- 標準エラー出力 ---"
            echo "$INVOCATION" | jq -r '.StandardErrorContent'
            exit 1
          fi
          echo "デプロイが正常に完了しました。"

