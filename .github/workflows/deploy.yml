# ワークフローの名前。
name: CD Pipeline (Deploy)

# 実行タイミング（トリガー）の設定。
on:
  workflow_dispatch: # GitHubのブラウザ画面から手動で実行できるようにします。
  push:
    branches: [main, develop] # main または develop ブランチにコードが保存(push)された時に実行

jobs:
  # ==========================================
  # デプロイ (本番/開発環境への反映)
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    
    # 安全に AWS と通信（認証）するための権限設定
    permissions:
      id-token: write # GitHub IDトークンを発行して AWS とのやり取りに使います
      contents: read

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      # --- AWS 認証 ---
      # ログイン情報（IAMロール）を GitHub Secrets から読み込み、AWSを使えるようにします。
      - name: AWS 認証設定
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      # --- 最新のEC2 IPを取得 ---
      # 固定IP(Elastic IP)を使わない場合、再作成のたびにIPが変わるため、タグを元に最新のIPをAWSから聞き出します。
      - name: 最新のEC2 IPを取得
        id: get-ip
        run: |
          # タグ Name=todo-app-ec2 (project_nameによって変わります) かつ 実行中(running)のインスタンスを探します
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=todo-app-ec2" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          
          if [ "$IP" == "None" ] || [ -z "$IP" ]; then
            echo "エラー: 起動中のEC2インスタンスが見つかりませんでした。"
            exit 1
          fi
          
          echo "取得したIP: $IP"
          echo "ip=$IP" >> $GITHUB_OUTPUT

      # --- フロントエンドのデプロイ (S3 & CloudFront) ---
      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: フロントエンドのビルド
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      # ビルドされたファイルを S3 バケットにコピーします。
      - name: S3へ同期
        run: |
          aws s3 sync ./frontend/dist s3://${{ secrets.S3_BUCKET_NAME }} --delete

      # 世界中のキャッシュサーバー(CloudFront)に残っている古いデータを消去します。
      - name: CloudFrontキャッシュクリア (Invalidation)
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      # --- バックエンドのデプロイ (EC2) ---
      # バックエンドサーバー(EC2)に直接ログイン(SSH)して操作します。
      - name: EC2へデプロイ
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.get-ip.outputs.ip }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            PROJECT_DIR="$HOME/251025"
            # 1. フォルダの準備
            if [ ! -d "$PROJECT_DIR" ]; then
              git clone https://github.com/${{ github.repository }}.git "$PROJECT_DIR"
            fi
            cd "$PROJECT_DIR"
            
            # 2. .env ファイルの避難 (reset で消えないようにする)
            if [ -f ".env" ]; then
              cp .env ../.env.bak
            fi
            
            # 3. コードの更新
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            
            # 4. .env ファイルの復元
            if [ -f "../.env.bak" ]; then
              mv ../.env.bak .env
            else
              echo "CRITICAL WARNING: .env file is missing! Please run terraform apply again or create it manually."
            fi
            
            # 5. Docker Compose (V2) の確実なインストール
            if ! command -v docker-compose &> /dev/null; then
              echo "Installing Docker Compose standalone..."
              sudo curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o /usr/bin/docker-compose
              sudo chmod +x /usr/bin/docker-compose
            fi
            
            # 6. Docker の状態確認
            sudo systemctl start docker
            
            # 7. コンテナの起動 (絶対パスでハイフン形式を使用)
            echo "Starting containers..."
            sudo /usr/bin/docker-compose up -d --build
            
            # 8. データベース更新
            echo "Waiting for app to start..."
            sleep 20
            sudo /usr/bin/docker-compose exec -T backend alembic upgrade head
