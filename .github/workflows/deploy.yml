# ワークフローの名前。
name: CD Pipeline (Deploy)

# 実行タイミング（トリガー）の設定。
on:
  workflow_dispatch: # GitHubのブラウザ画面から手動で実行できるようにします。
  push:
    branches: [main, develop] # main または develop ブランチにコードが保存(push)された時に実行

jobs:
  # ==========================================
  # デプロイ (本番/開発環境への反映)
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    
    # 安全に AWS と通信（認証）するための権限設定
    permissions:
      id-token: write # GitHub IDトークンを発行して AWS とのやり取りに使います
      contents: read

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      # --- AWS 認証 ---
      # ログイン情報（IAMロール）を GitHub Secrets から読み込み、AWSを使えるようにします。
      - name: AWS 認証設定
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      # --- 最新のインフラ情報を取得 ---
      - name: 最新のインフラ情報を取得
        id: infra-info
        run: |
          # 1. EC2のIP取得 (タグ: Name=todo-app-ec2)
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=todo-app-ec2" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          
          if [ "$IP" == "None" ] || [ -z "$IP" ]; then
            echo "エラー: 起動中のEC2インスタンスが見つかりませんでした。"
            exit 1
          fi
          echo "EC2 IP: $IP"
          echo "ec2_ip=$IP" >> $GITHUB_OUTPUT

          # 2. S3バケット名取得 (タグ: Name=todo-app-frontend-bucket)
          # resourcegroupstaggingapi を使うとタグからARNを引けます
          S3_ARN=$(aws resourcegroupstaggingapi get-resources \
            --tag-filters Key=Name,Values=todo-app-frontend-bucket \
            --query "ResourceTagMappingList[0].ResourceARN" \
            --output text)
          
          if [ "$S3_ARN" == "None" ] || [ -z "$S3_ARN" ]; then
            echo "エラー: S3バケットが見つかりませんでした。"
            exit 1
          fi
          S3_BUCKET_NAME=${S3_ARN##*:} # arn:aws:s3:::bucket-name から名前だけ抽出
          echo "S3 Bucket: $S3_BUCKET_NAME"
          echo "s3_bucket=$S3_BUCKET_NAME" >> $GITHUB_OUTPUT

          # 3. CloudFront情報の取得
          # S3バケット名をオリジンに持つディストリビューションを検索します
          CF_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[?contains(DomainName, '$S3_BUCKET_NAME')]].Id" \
            --output text | awk '{print $1}')
          
          if [ "$CF_ID" == "None" ] || [ -z "$CF_ID" ]; then
            echo "エラー: S3バケット ($S3_BUCKET_NAME) をオリジンに持つCloudFrontが見つかりませんでした。"
            exit 1
          fi
          
          # IDを使用してドメイン名を取得
          CF_DOMAIN=$(aws cloudfront get-distribution --id "$CF_ID" --query "Distribution.DomainName" --output text)
          
          echo "CloudFront Domain: $CF_DOMAIN"
          echo "CloudFront ID: $CF_ID"
          echo "cf_domain=$CF_DOMAIN" >> $GITHUB_OUTPUT
          echo "cf_id=$CF_ID" >> $GITHUB_OUTPUT

          # 4. RDS エンドポイントの取得 (タグ: Name=todo-app-rds)
          RDS_ENDPOINT=$(aws rds describe-db-instances \
            --filters "Name=db-instance-id,Values=todo-app-db" \
            --query "DBInstances[0].Endpoint.Address" \
            --output text)
          echo "RDS Endpoint: $RDS_ENDPOINT"
          echo "rds_endpoint=$RDS_ENDPOINT" >> $GITHUB_OUTPUT

      # --- フロントエンドのデプロイ (S3 & CloudFront) ---
      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: フロントエンドのビルド
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: https://${{ steps.infra-info.outputs.cf_domain }}
        run: |
          npm ci
          npm run build

      # ビルドされたファイルを S3 バケットにコピーします。
      - name: S3へ同期
        run: |
          aws s3 sync ./frontend/dist s3://${{ steps.infra-info.outputs.s3_bucket }} --delete

      # 世界中のキャッシュサーバー(CloudFront)に残っている古いデータを消去します。
      - name: CloudFrontキャッシュクリア (Invalidation)
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ steps.infra-info.outputs.cf_id }} --paths "/*"

      # --- バックエンドのデプロイ (EC2) ---
      # バックエンドサーバー(EC2)に直接ログイン(SSH)して操作します。
      - name: EC2へデプロイ
        uses: appleboy/ssh-action@v1.0.3
        # シークレットや動的な値を env ブロックで定義
        env:
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          CF_DOMAIN: ${{ steps.infra-info.outputs.cf_domain }}
          RDS_ENDPOINT: ${{ steps.infra-info.outputs.rds_endpoint }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ steps.infra-info.outputs.ec2_ip }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          # SSH先に渡す環境変数を指定
          envs: APP_SECRET_KEY,CF_DOMAIN,RDS_ENDPOINT,DB_PASSWORD
          script: |
            PROJECT_DIR="$HOME/251025"
            # 1. フォルダの準備
            if [ ! -d "$PROJECT_DIR" ]; then
              git clone https://github.com/${{ github.repository }}.git "$PROJECT_DIR"
            fi
            cd "$PROJECT_DIR"
            
            # 2. .env ファイルの避難
            if [ -f ".env" ]; then
              cp .env ../.env.bak
            fi
            
            # 3. コードの更新
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            
            # 4. .env ファイルの準備
            # 既存の .env があればバックアップから復元、なければ空ファイルを作成
            if [ -f "../.env.bak" ]; then
              mv ../.env.bak .env
            else
              touch .env
            fi

            # 5. 重要変数の更新 (特殊文字に強いprintf方式)
            echo "Updating .env with latest infrastructure values..."
            # 既存の対象行を一旦削除 (一時ファイルを使用)
            grep -v -E "^(DATABASE_URL|POSTGRES_USER|POSTGRES_PASSWORD|POSTGRES_DB|SECRET_KEY|ENV|CORS_ORIGINS)=" .env > .env.tmp || true
            
            # 安全に値を追記
            {
              printf 'DATABASE_URL=postgresql+asyncpg://postgresMaster:%s@%s/todo_db?ssl=require\n' "$DB_PASSWORD" "$RDS_ENDPOINT"
              echo "POSTGRES_USER=postgresMaster"
              printf 'POSTGRES_PASSWORD=%s\n' "$DB_PASSWORD"
              echo "POSTGRES_DB=todo_db"
              printf 'SECRET_KEY=%s\n' "$APP_SECRET_KEY"
              echo "ENV=production"
              echo "CORS_ORIGINS=https://${CF_DOMAIN}"
            } >> .env.tmp
            mv .env.tmp .env
            
            # 6. Docker Compose (V2) の確実なインストール
            if ! command -v docker-compose &> /dev/null; then
              echo "Installing Docker Compose standalone..."
              sudo curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o /usr/bin/docker-compose
              sudo chmod +x /usr/bin/docker-compose
            fi
            
            # 7. Docker の状態確認
            sudo systemctl start docker
            
            # 8. コンテナの起動
            echo "Starting containers..."
            sudo /usr/bin/docker-compose up -d --build
            
            # 9. データベース更新
            echo "Waiting for app to start..."
            sleep 20
            sudo /usr/bin/docker-compose exec -T backend alembic upgrade head
