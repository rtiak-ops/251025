services:
  # --- データの保管庫 (データベース層) ---
  # 大切なデータを守る、システムの心臓部です。
  db:
    # 安定感抜群のPostgreSQL 17を採用しています。
    image: postgres:17
    container_name: todo_db_1025
    # 万が一コンテナが倒れても、Dockerが自動で起こしてくれるので安心です。
    restart: always
    environment:
      # ここで設定した情報は、後でバックエンドから接続する時に使います。
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_pass
      POSTGRES_DB: todo_db
    volumes:
      # 【重要】これがないと、コンテナを消した時にデータも消えてしまいます。
      # データを「外出し」して、安全に永続化するための設定です。
      - postgres_data:/var/lib/postgresql/data
    # 外部からDBを直接覗きたい時は、下のコメントアウトを外すと5432番で繋がります。
    # ports:
    #   - "5432:5432"
    # DBが「準備完了」になったかを確認する仕組みです。
    # 次のbackendサービスが「DBまだ？」と待てるようになります。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 知能の部分 (バックエンド層 / FastAPI) ---
  # データの処理や、データベースとのやり取りを担当します。
  backend:
    build: ./backend
    container_name: todo_backend_1025
    # 本番環境では自動リロードをオフにし、安定性を優先します。
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: always
    environment:
      # DBへの接続先です。
      DATABASE_URL: postgresql+asyncpg://todo_user:todo_pass@db:5432/todo_db
    depends_on:
      db:
        condition: service_healthy

  # --- 見た目と窓口の部分 (フロントエンド層 + Nginx) ---
  # ビルド済みの画面を配信し、APIへのリクエストをバックエンドへ中継します。
  frontend:
    build: ./frontend
    container_name: todo_frontend_1025
    restart: always
    environment:
      # Nginx テンプレートがバックエンドを指すための URL です
      - BACKEND_URL=http://backend:8000
    ports:
      # ブラウザで http://localhost にアクセスするとアプリが見えます！
      # 標準的なWebポート（80番）を使用します。
      - "80:80"
    depends_on:
      - backend

# --- 共通の道具箱 ---
volumes:
  # ここで名前を付けたボリュームは、コンテナを作り直しても残り続けます。
  postgres_data:
    driver: local