services:
  # --- データの保管庫 (データベース層) ---
  # 大切なデータを守る、システムの心臓部です。
  db:
    # 安定感抜群のPostgreSQL 17を採用しています。
    image: postgres:17
    container_name: todo_db_1025
    # 万が一コンテナが倒れても、Dockerが自動で起こしてくれるので安心です。
    restart: always
    environment:
      # ここで設定した情報は、後でバックエンドから接続する時に使います。
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_pass
      POSTGRES_DB: todo_db
    volumes:
      # 【重要】これがないと、コンテナを消した時にデータも消えてしまいます。
      # データを「外出し」して、安全に永続化するための設定です。
      - postgres_data:/var/lib/postgresql/data
    # 外部からDBを直接覗きたい時は、下のコメントアウトを外すと5432番で繋がります。
    # ports:
    #   - "5432:5432"
    # DBが「準備完了」になったかを確認する仕組みです。
    # 次のbackendサービスが「DBまだ？」と待てるようになります。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 知能の部分 (バックエンド層 / FastAPI) ---
  # データの処理や、データベースとのやり取りを担当します。
  backend:
    # ./backendフォルダにあるDockerfileから、あなた専用のイメージを作ります。
    build: ./backend
    container_name: todo_backend_1025
    # --reloadをつけることで、プログラムを書き換えると即座に反映されます（開発の味方！）。
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always
    volumes:
      # 自分のパソコン上のコード変更を、リアルタイムでコンテナに伝えます。
      - ./backend:/app
    environment:
      # DBへの接続先です。ホスト名にはサービス名の「db」を指定するだけで繋がります。
      DATABASE_URL: postgresql+asyncpg://todo_user:todo_pass@db:5432/todo_db
    depends_on:
      # 「DBがちゃんと動き出してから、バックエンドを起動する」という順番を守る設定です。
      db:
        condition: service_healthy
    ports:
      # ブラウザ等から http://localhost:8000 でAPIにアクセスできるようになります。
      - "8000:8000"

  # --- 見た目の部分 (フロントエンド層 / React/Vite) ---
  # ユーザーが実際に操作する画面を表示します。
  frontend:
    build: ./frontend
    container_name: todo_frontend_1025
    restart: always
    ports:
      # ブラウザで http://localhost:5173 を開くと、あなたのアプリが見えます！
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # 【工夫】コンテナ内のnode_modulesを保護し、動作を安定させています。
      - /app/node_modules
    # 開発サーバーとのやり取りをスムーズにするための、おまじないのような設定です。
    stdin_open: true
    tty: true
    depends_on:
      # まずは裏方のバックエンドが動いていることを確認します。
      - backend

# --- 共通の道具箱 ---
volumes:
  # ここで名前を付けたボリュームは、コンテナを作り直しても残り続けます。
  postgres_data:
    driver: local